<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#33684E">
<title>Домашний реестр</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:wght@700&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="app-style">
:root{
  --bg:#F1F2ED; --surface:#FBFBF8; --surface2:#E9EBE2; --ink:#22261F; --muted:#6C7365;
  --line:#D9DCCF; --accent:#33684E; --accent-soft:#E2EDE4; --accent-ink:#FFFFFF;
  --sale:#A2691E; --sale-soft:#F3E8D3; --danger:#A63D2F; --shadow:0 12px 40px rgba(30,38,28,.18);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141714; --surface:#1C201C; --surface2:#242A23; --ink:#E7EAE2; --muted:#96A090;
    --line:#2D332C; --accent:#7CC49E; --accent-soft:#24352C; --accent-ink:#10231A;
    --sale:#D9A055; --sale-soft:#3A301C; --danger:#E07B6B; --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#141714; --surface:#1C201C; --surface2:#242A23; --ink:#E7EAE2; --muted:#96A090;
  --line:#2D332C; --accent:#7CC49E; --accent-soft:#24352C; --accent-ink:#10231A;
  --sale:#D9A055; --sale-soft:#3A301C; --danger:#E07B6B; --shadow:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Golos Text',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[data-a]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;resize:vertical;min-height:74px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ── шапка ── */
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--line)}
.wordmark{font-family:'PT Serif',Georgia,serif;font-weight:700;font-size:19px;letter-spacing:.2px;white-space:nowrap}
.wordmark .leaf{color:var(--accent)}
#q{flex:1;max-width:340px;min-width:0}
#chip{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:8px;padding:4px 6px}
#chip:hover{background:var(--surface2)}
#chip::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.85}
#chip.pending::before{background:var(--sale)}
#chip.err::before,#chip.local::before{background:var(--danger)}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:8px 14px;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface2);color:var(--ink);font-weight:500}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.iconbtn{font-size:18px;padding:6px 8px;border-radius:8px}
.iconbtn:hover{background:var(--surface2)}

/* ── каркас ── */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:0;max-width:1280px;margin:0 auto}
nav#nav{padding:18px 10px 40px 18px;border-right:1px solid var(--line);position:sticky;top:53px;height:calc(100vh - 53px);overflow-y:auto}
main#main{padding:20px 18px 80px;min-width:0}
.navgroup{margin-bottom:18px}
.navgroup h4{margin:0 0 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 9px;border-radius:8px;color:var(--ink)}
.navitem:hover{background:var(--surface2)}
.navitem.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navitem .n{margin-left:auto;font-size:12px;color:var(--muted)}
.navitem.on .n{color:inherit}

/* ── карточки ── */
.viewtitle{display:flex;align-items:baseline;gap:10px;margin:2px 0 14px}
.viewtitle h2{margin:0;font-family:'PT Serif',Georgia,serif;font-size:22px}
.viewtitle .n{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card-top{display:flex;gap:10px;align-items:flex-start}
.card-ic{font-size:22px;line-height:1.2}
.card-top h3{margin:0;font-size:15.5px;font-weight:600;line-height:1.3}
.card-cat{font-size:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:auto;white-space:nowrap}
.badge.sale{background:var(--sale-soft);color:var(--sale)}
.badge.archive{background:var(--surface2);color:var(--muted)}
.card-notes{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:12px;color:var(--muted);margin-top:auto}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}

/* ── сводные списки ── */
.groupblock{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.groupblock h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.groupblock h3 button{color:var(--accent);font-weight:600;font-size:13px}
.row{display:flex;align-items:flex-start;gap:9px;padding:6px 2px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none}
.row input[type=checkbox]{width:17px;height:17px;margin-top:2px;accent-color:var(--accent);flex:none;cursor:pointer}
.row .t{flex:1;min-width:0}
.row.done .t{color:var(--muted);text-decoration:line-through}
.row .src{font-size:12px;color:var(--accent);white-space:nowrap;cursor:pointer}
.row .x{color:var(--muted);font-size:15px;padding:0 4px;flex:none}
.row .x:hover{color:var(--danger)}
.kind{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--surface2);color:var(--muted);flex:none;margin-top:2px}
.kind.buy{background:var(--accent-soft);color:var(--accent)}

/* ── панель объекта ── */
#scrim{position:fixed;inset:0;background:rgba(15,20,15,.45);z-index:40}
#detail{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;overflow-y:auto;padding:16px 20px 60px}
@media (prefers-reduced-motion: no-preference){
  #detail{animation:slidein .18s ease-out}
  @keyframes slidein{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
}
.d-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.d-head .ic{font-size:26px}
#d-name{flex:1;min-width:0;font-size:18px;font-weight:600;background:transparent;border-color:transparent}
#d-name:hover,#d-name:focus{border-color:var(--line);background:var(--surface)}
.d-close{font-size:22px;color:var(--muted);padding:4px 8px}
.d-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface2);border-radius:9px;padding:3px}
.seg button{padding:5px 11px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.sale{color:var(--sale)}
section.d-sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:12px}
.d-sec h3{margin:0 0 10px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.specs{display:grid;grid-template-columns:minmax(90px,38%) 1fr 26px;gap:6px;align-items:center}
.specs input{padding:5px 9px;font-size:13.5px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input[type=text]{flex:1;min-width:0}
.addrow .btn{padding:7px 12px}
.instr{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.instr h4{margin:0 0 4px;font-size:14px}
.instr p{margin:0;font-size:13.5px;white-space:pre-wrap;color:var(--ink)}
.instr .tools{margin-top:6px;display:flex;gap:12px}
.instr .tools button{font-size:12.5px;color:var(--accent);font-weight:600}
.instr .tools button.rm{color:var(--muted)}
.instr input,.instr textarea{width:100%;margin-bottom:6px}
.kindpick{display:flex;gap:6px}
.kindpick button{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.kindpick button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.d-foot{display:flex;gap:10px;margin-top:18px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}

/* ── фото ── */
.photos{display:flex;flex-wrap:wrap;gap:8px}
.thumb{width:86px;height:86px;border-radius:10px;border:1px solid var(--line);object-fit:cover;cursor:pointer;background:var(--surface2)}
.thumb.loading{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.addphoto{width:86px;height:86px;border-radius:10px;border:1.5px dashed var(--line);color:var(--muted);font-size:24px}
.addphoto:hover{border-color:var(--accent);color:var(--accent)}
#pviewer{position:fixed;inset:0;z-index:70;background:rgba(10,12,10,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#pviewer img{max-width:100%;max-height:80vh;border-radius:10px}
#pviewer .tools{display:flex;gap:14px}
#pviewer button{color:#fff;background:rgba(255,255,255,.14);border-radius:9px;padding:8px 16px}

/* ── модалки ── */
#modal,#settings{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;background:rgba(15,20,15,.45);padding:20px;overflow-y:auto}
.modal-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;width:min(480px,100%);margin:auto 0}
.modal-box h3{margin:0 0 14px;font-family:'PT Serif',Georgia,serif;font-size:18px}
.modal-box h4{margin:18px 0 8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.modal-box label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.modal-box input,.modal-box select{width:100%}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.status-line{font-size:13px;margin-top:8px}
.status-line.ok{color:var(--accent)}
.status-line.bad{color:var(--danger)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
details.help{margin-top:10px;font-size:13px;color:var(--muted)}
details.help summary{cursor:pointer;color:var(--accent);font-weight:600}
details.help ol{padding-left:18px;margin:8px 0}
details.help li{margin-bottom:4px}
.backendpick{margin-bottom:6px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;z-index:80;box-shadow:var(--shadow);max-width:90vw}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  nav#nav{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:14px;overflow-x:auto}
  .navgroup{margin:0;display:flex;gap:6px;align-items:center;flex:none}
  .navgroup h4{display:none}
  .navitem{white-space:nowrap;padding:6px 11px;background:var(--surface2);border-radius:99px}
  .navitem.on{background:var(--accent-soft)}
  header.top{flex-wrap:wrap;gap:8px 10px}
  #q{order:3;flex-basis:100%;max-width:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="wordmark">Домашний <span class="leaf">реестр</span></div>
  <input id="q" type="search" placeholder="Поиск по объектам…" autocomplete="off">
  <span id="chip" role="button" tabindex="0" data-a="settings" title="Настройки синхронизации">Загрузка…</span>
  <button class="iconbtn" data-a="settings" title="Настройки">⚙</button>
  <button class="btn" data-a="new">+ Объект</button>
</header>
<div class="shell">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="scrim" hidden data-a="close"></div>
<aside id="detail" hidden></aside>
<div id="modal" hidden></div>
<div id="settings" hidden></div>
<div id="pviewer" hidden></div>
<div id="toast" hidden></div>
<input id="photo-input" type="file" accept="image/*" hidden>
<input id="import-input" type="file" accept="application/json,.json" hidden>

<script id="app-code">
(function(){
'use strict';
var CATS={home:{label:'Дом',icon:'🏠'},car:{label:'Машина',icon:'🚗'},tech:{label:'Техника',icon:'🔧'},stuff:{label:'Вещи',icon:'📦'}};
var LSKEY='home-registry-v1', GHKEY='home-registry-gh', YDKEY='home-registry-yd', BACKKEY='home-registry-backend';
var STATE_PATH='data/state.json';
var YD_API='https://cloud-api.yandex.net/v1/disk';
var YD_STATE='app:/state.json';

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function plural(n,f){var m10=n%10,m100=n%100;var i=(m10===1&&m100!==11)?0:(m10>=2&&m10<=4&&(m100<12||m100>14))?1:2;return n+' '+f[i];}
function b64e(str){var u=new TextEncoder().encode(str),s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function b64d(b){b=String(b).replace(/\s/g,'');var bin=atob(b),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

var SEED={rev:1,updatedAt:0,items:[
 {id:'ex-car',name:'Автомобиль',cat:'car',status:'active',price:'',
  notes:'Карточка-пример. Замените данными своей машины или удалите её кнопкой внизу панели.',
  specs:[{id:uid(),k:'Госномер',v:'—'},{id:uid(),k:'Пробег',v:'—'}],
  instructions:[{id:uid(),title:'Давление в шинах',text:'Проверять раз в месяц и перед дальней дорогой. Рекомендованные значения указаны на стойке водительской двери.'}],
  tasks:[{id:uid(),text:'Записаться на замену масла',done:false}],
  questions:[{id:uid(),text:'Когда в последний раз меняли тормозную жидкость?',done:false}],
  plans:[{id:uid(),text:'Щётки стеклоочистителя на зиму',done:false,kind:'buy'}],photos:[]},
 {id:'ex-wash',name:'Стиральная машина',cat:'tech',status:'active',price:'',
  notes:'',specs:[{id:uid(),k:'Модель',v:'—'}],
  instructions:[{id:uid(),title:'Чистка фильтра',text:'Раз в 2–3 месяца: открыть лючок внизу справа, подставить плоскую ёмкость, выкрутить фильтр против часовой стрелки, промыть под водой.'}],
  tasks:[],questions:[],plans:[],photos:[]},
 {id:'ex-flat',name:'Квартира',cat:'home',status:'active',price:'',
  notes:'',specs:[],instructions:[],tasks:[],questions:[],
  plans:[{id:uid(),text:'Фильтры для кухонной вытяжки',done:false,kind:'buy'},{id:uid(),text:'Полки в кладовку',done:false,kind:'improve'}],photos:[]}
]};

var state=null, saveTimer=null, retryTimer=null, syncing=false, lastPull=0;
var route={view:'all',item:null};
var query='', editingInstr={}, newPlanKind='buy', confirmDel=false, refocus=null, settingsBackend=null;
var photoCache={};

/* ══════════ бэкенд: GitHub ══════════ */
function ghCfg(){var c=lsGet(GHKEY);return (c&&c.owner&&c.repo&&c.token)?c:null;}
function ghHeaders(accept){var c=ghCfg();return {'Authorization':'Bearer '+c.token,'Accept':accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};}
function ghUrl(path){var c=ghCfg();return 'https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+path;}
function ghGetJson(path){
  return fetch(ghUrl(path),{headers:ghHeaders(),cache:'no-store'}).then(function(r){
    if(r.status===404)return null;
    if(!r.ok)throw {status:r.status,backend:'gh'};
    return r.json();
  });
}
var GH={
  name:'github',
  ready:function(){return !!ghCfg();},
  getState:function(){
    return ghGetJson(STATE_PATH).then(function(j){
      if(!j)return null;
      var text=(j.content&&j.encoding==='base64')?b64d(j.content):null;
      if(text==null)return fetch(ghUrl(STATE_PATH),{headers:ghHeaders('application/vnd.github.raw+json'),cache:'no-store'})
        .then(function(r){if(!r.ok)throw {status:r.status,backend:'gh'};return r.text();})
        .then(function(t){return {data:JSON.parse(t),tag:j.sha};});
      return {data:JSON.parse(text),tag:j.sha};
    });
  },
  putState:function(json,tag){
    var body={message:'Обновление данных реестра',content:b64e(json)};
    if(tag)body.sha=tag;
    return fetch(ghUrl(STATE_PATH),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)}).then(function(r){
      if(!r.ok)throw {status:r.status,backend:'gh'};
    });
  },
  uploadPhoto:function(it,blob){
    var path='photos/'+it.id+'/'+uid()+'.jpg';
    return blobToB64(blob).then(function(b64){
      return fetch(ghUrl(path),{method:'PUT',headers:ghHeaders(),body:JSON.stringify({message:'Фото: '+it.name,content:b64})});
    }).then(function(r){
      if(!r.ok)throw {status:r.status,backend:'gh'};
      return path;
    });
  },
  photoBlob:function(path){
    return fetch(ghUrl(path),{headers:ghHeaders('application/vnd.github.raw+json')}).then(function(r){
      if(!r.ok)throw {status:r.status,backend:'gh'};
      return r.blob();
    });
  },
  deletePhoto:function(path){
    var dir=path.slice(0,path.lastIndexOf('/'));
    return ghGetJson(dir).then(function(list){
      var entry=(list||[]).filter(function(f){return f.path===path;})[0];
      if(!entry)return;
      return fetch(ghUrl(path),{method:'DELETE',headers:ghHeaders(),body:JSON.stringify({message:'Удаление фото',sha:entry.sha})});
    });
  },
  errText:function(e){
    var s=e&&e.status;
    if(s===401)return 'Токен GitHub не принят — проверьте настройки';
    if(s===403)return 'GitHub: нет прав или исчерпан лимит';
    if(s===404)return 'Репозиторий не найден — проверьте настройки';
    return 'Нет связи с GitHub';
  }
};

/* ══════════ бэкенд: Яндекс Диск ══════════ */
function ydCfg(){return lsGet(YDKEY);}
function ydReady(){var c=ydCfg();return !!(c&&c.token&&(!c.exp||Date.now()<c.exp));}
function ydHeaders(){return {'Authorization':'OAuth '+ydCfg().token};}
function ydFetch(url,opts){
  opts=opts||{};opts.headers=Object.assign({},ydHeaders(),opts.headers||{});opts.cache='no-store';
  return fetch(url,opts).then(function(r){
    if(r.status===404)return null;
    if(!r.ok)throw {status:r.status,backend:'yd'};
    return r.status===204||r.status===202?{}:r.json();
  });
}
var ydPhotosDirOk=false;
function ydEnsurePhotosDir(){
  if(ydPhotosDirOk)return Promise.resolve();
  return fetch(YD_API+'/resources?path='+encodeURIComponent('app:/photos'),{method:'PUT',headers:ydHeaders()})
    .then(function(r){
      if(r.ok||r.status===409){ydPhotosDirOk=true;return;}
      throw {status:r.status,backend:'yd'};
    });
}
function ydDownload(path){
  return ydFetch(YD_API+'/resources/download?path='+encodeURIComponent(path)).then(function(j){
    if(!j)return null;
    return fetch(j.href,{cache:'no-store'}).then(function(r){
      if(!r.ok)throw {status:r.status,backend:'yd'};
      return r;
    });
  });
}
function ydUpload(path,body){
  return ydFetch(YD_API+'/resources/upload?path='+encodeURIComponent(path)+'&overwrite=true').then(function(j){
    if(!j)throw {status:409,backend:'yd'};
    return fetch(j.href,{method:'PUT',body:body}).then(function(r){
      if(!r.ok)throw {status:r.status,backend:'yd'};
    });
  });
}
var YD={
  name:'yandex',
  ready:ydReady,
  getState:function(){
    return ydDownload(YD_STATE).then(function(r){
      if(!r)return null;
      return r.json().then(function(data){return {data:data,tag:null};});
    });
  },
  putState:function(json){
    return ydUpload(YD_STATE,new Blob([json],{type:'application/json'}));
  },
  uploadPhoto:function(it,blob){
    var path='app:/photos/'+it.id+'-'+uid()+'.jpg';
    return ydEnsurePhotosDir().then(function(){return ydUpload(path,blob);}).then(function(){return path;});
  },
  photoBlob:function(path){
    return ydDownload(path).then(function(r){
      if(!r)throw {status:404,backend:'yd'};
      return r.blob();
    });
  },
  deletePhoto:function(path){
    return fetch(YD_API+'/resources?path='+encodeURIComponent(path)+'&permanently=true',{method:'DELETE',headers:ydHeaders()});
  },
  errText:function(e){
    var s=e&&e.status;
    if(s===401)return 'Вход в Яндекс истёк — войдите заново (⚙)';
    if(s===403)return 'Яндекс Диск: нет прав у токена';
    if(s===507)return 'На Диске закончилось место';
    return 'Нет связи с Яндекс Диском';
  }
};

/* ══════════ локальный кэш и синхронизация ══════════ */
function readLocal(){return lsGet(LSKEY);}
function writeLocal(){lsSet(LSKEY,state);}

function setChip(mode,msg){
  var c=document.getElementById('chip');
  c.className='';
  if(mode==='pending'){c.classList.add('pending');c.textContent='Сохранение…';}
  else if(mode==='saved'){c.textContent=backendName()==='yandex'?'Синхронизировано · Я.Диск':'Синхронизировано · GitHub';}
  else if(mode==='local'){c.classList.add('local');c.textContent='Только на этом устройстве';}
  else if(mode==='err'){c.classList.add('err');c.textContent=msg||'Ошибка';}
}
function errChip(e){
  var p=(e&&e.backend==='yd')?YD:GH;
  setChip('err',p.errText(e));
}
function adoptRemote(remote){
  state=remote;
  if(!state.items)state.items=[];
  writeLocal();renderAll();
}
function pull(quiet){
  var p=provider();
  if(!p){setChip('local');return Promise.resolve();}
  lastPull=Date.now();
  return p.getState().then(function(got){
    if(got&&(got.data.rev||0)>(state.rev||0)){
      adoptRemote(got.data);
      if(!quiet)toast('Данные обновлены из хранилища');
    }
    setChip('saved');
  }).catch(errChip);
}
function touch(){
  state.rev=(state.rev||0)+1;state.updatedAt=Date.now();
  writeLocal();
  if(!provider()){setChip('local');return;}
  setChip('pending');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(push,1400);
}
function push(attempt){
  var p=provider();
  if(!p){setChip('local');return;}
  if(syncing){clearTimeout(saveTimer);saveTimer=setTimeout(push,1000);return;}
  syncing=true;
  p.getState().then(function(got){
    if(got&&(got.data.rev||0)>(state.rev||0)){
      adoptRemote(got.data);
      toast('На другом устройстве версия новее — загрузил её');
      setChip('saved');return;
    }
    return p.putState(JSON.stringify(state),got?got.tag:null)
      .then(function(){setChip('saved');});
  }).catch(function(e){
    if(e&&e.status===409&&!attempt){syncing=false;push(1);return;}
    if((e&&e.status>=500)||!e||!e.status){
      clearTimeout(retryTimer);retryTimer=setTimeout(function(){push();},4000+Math.random()*2000);
      setChip('pending');return;
    }
    errChip(e);
  }).finally(function(){syncing=false;});
}

/* ══════════ фото ══════════ */
function compressImage(file){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,1600/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej(new Error('convert'));},'image/jpeg',0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}
function blobToB64(blob){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){res(String(fr.result).split(',')[1]);};
    fr.onerror=rej;
    fr.readAsDataURL(blob);
  });
}
function addPhoto(it,file){
  var p=provider();
  if(!p){toast('Фото хранятся в облаке — сначала настройте синхронизацию (⚙)');return;}
  toast('Загружаю фото…');
  compressImage(file).then(function(blob){
    return p.uploadPhoto(it,blob).then(function(path){
      it.photos=it.photos||[];
      it.photos.push({id:uid(),path:path});
      touch();renderDetail();
      toast('Фото добавлено');
    });
  }).catch(function(e){toast('Не получилось загрузить фото: '+((e&&e.backend)?(e.backend==='yd'?YD:GH).errText(e):'ошибка обработки файла'));});
}
function photoUrl(path){
  if(photoCache[path])return Promise.resolve(photoCache[path]);
  var p=photoProvider(path);
  if(!p)return Promise.reject(new Error('backend'));
  return p.photoBlob(path).then(function(b){
    var u=URL.createObjectURL(b);photoCache[path]=u;return u;
  });
}
function hydratePhotos(root){
  (root||document).querySelectorAll('img[data-photo]').forEach(function(img){
    photoUrl(img.dataset.photo).then(function(u){img.src=u;img.classList.remove('loading');})
      .catch(function(){img.alt='не загрузилось';});
  });
}
function delPhoto(it,photoId){
  var ph=(it.photos||[]).filter(function(p){return p.id===photoId;})[0];
  it.photos=(it.photos||[]).filter(function(p){return p.id!==photoId;});
  touch();renderDetail();closeViewer();
  if(ph){
    var p=photoProvider(ph.path);
    if(p)p.deletePhoto(ph.path).catch(function(){});
  }
}

function find(id){for(var i=0;i<state.items.length;i++)if(state.items[i].id===id)return state.items[i];return null;}
function visible(it){return it.status!=='archive';}
function matches(it){
  if(!query)return true;
  var q=query.toLowerCase();
  var hay=[it.name,it.notes].concat((it.specs||[]).map(function(s){return s.k+' '+s.v;})).join(' ').toLowerCase();
  return hay.indexOf(q)>=0;
}

function openModal(){
  var m=document.getElementById('modal');
  m.hidden=false;
  var h='<div class="modal-box"><h3>Новый объект</h3>'
    +'<label for="ni-name">Название</label><input id="ni-name" type="text" placeholder="Например: холодильник, дача, велосипед…">'
    +'<label for="ni-cat">Раздел</label><select id="ni-cat">';
  Object.keys(CATS).forEach(function(c){h+='<option value="'+c+'">'+CATS[c].icon+' '+CATS[c].label+'</option>';});
  h+='</select><div class="modal-foot"><button class="btn ghost" data-a="modal-close">Отмена</button>'
    +'<button class="btn" data-a="create">Создать</button></div></div>';
  m.innerHTML=h;
  document.getElementById('ni-name').focus();
}
function closeModal(){var m=document.getElementById('modal');m.hidden=true;m.innerHTML='';}

/* ══════════ настройки ══════════ */
function openSettings(){
  if(!settingsBackend)settingsBackend=backendName()||'yandex';
  var s=document.getElementById('settings');
  s.hidden=false;
  var gh=lsGet(GHKEY)||{owner:'',repo:'home-registry-data',token:''};
  var yd=ydCfg()||{clientId:'',token:''};
  var h='<div class="modal-box"><h3>Настройки</h3>'
    +'<h4>Где хранить данные</h4>'
    +'<span class="seg backendpick">'
    +'<button class="'+(settingsBackend==='yandex'?'on':'')+'" data-a="pick-backend" data-v="yandex">Яндекс Диск</button>'
    +'<button class="'+(settingsBackend==='github'?'on':'')+'" data-a="pick-backend" data-v="github">GitHub</button>'
    +'</span>';

  if(settingsBackend==='yandex'){
    h+='<p class="hint">Данные и фото лягут в папку «Приложения» на вашем Диске. Приложение видит только её.</p>'
      +'<label for="yd-client">ID приложения (ClientID)</label>'
      +'<input id="yd-client" type="text" autocapitalize="off" autocomplete="off" value="'+esc(yd.clientId||'')+'" placeholder="из oauth.yandex.ru">'
      +'<div class="btnrow"><button class="btn ghost" data-a="yd-token-page">Шаг 1: получить токен ↗</button></div>'
      +'<label for="yd-token">Токен со страницы Яндекса</label>'
      +'<input id="yd-token" type="password" autocomplete="off" placeholder="y0_… (можно вставить весь адрес страницы)">'
      +'<div class="btnrow"><button class="btn" data-a="yd-connect">Шаг 2: подключить</button>'
      +(YD.ready()?'<button class="btn ghost" data-a="yd-off">Выйти</button>':'')
      +'</div><div id="be-status" class="status-line">'
      +(YD.ready()?'Вход выполнен.':(ydCfg()&&ydCfg().token?'Вход истёк — получите токен заново.':''))+'</div>'
      +'<details class="help"><summary>Как это настроить (один раз, ~5 минут)</summary><ol>'
      +'<li>Откройте <b>oauth.yandex.ru</b> → «Создать приложение». Название — любое, например «Домашний реестр».</li>'
      +'<li>Доступ к данным: <b>Доступ к папке приложения на Диске</b> (cloud_api:disk.app_folder).</li>'
      +'<li>Redirect URI менять не нужно — оставьте как предлагает Яндекс.</li>'
      +'<li>Скопируйте <b>ClientID</b> созданного приложения в поле выше и нажмите «Шаг 1».</li>'
      +'<li>Подтвердите доступ — Яндекс покажет страницу с токеном. Скопируйте токен (или весь адрес страницы) и вставьте в поле «Шаг 2».</li>'
      +'</ol></details>';
  }else{
    h+='<p class="hint">Данные хранятся в вашем приватном репозитории GitHub.</p>'
      +'<label for="gh-owner">Логин на GitHub</label><input id="gh-owner" type="text" autocapitalize="off" autocomplete="off" value="'+esc(gh.owner)+'" placeholder="например: AndrewRabe">'
      +'<label for="gh-repo">Приватный репозиторий для данных</label><input id="gh-repo" type="text" autocapitalize="off" autocomplete="off" value="'+esc(gh.repo)+'" placeholder="home-registry-data">'
      +'<label for="gh-token">Токен доступа (fine-grained)</label><input id="gh-token" type="password" autocomplete="off" value="'+esc(gh.token)+'" placeholder="github_pat_…">'
      +'<div class="btnrow"><button class="btn" data-a="gh-save">Проверить и сохранить</button>'
      +(ghCfg()?'<button class="btn ghost" data-a="gh-off">Отключить</button>':'')
      +'</div><div id="be-status" class="status-line"></div>'
      +'<details class="help"><summary>Как создать репозиторий и токен</summary><ol>'
      +'<li>github.com → «+» → New repository, имя <b>home-registry-data</b>, видимость <b>Private</b>, Create.</li>'
      +'<li>Settings (профиля) → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token.</li>'
      +'<li>Repository access: <b>Only select repositories</b> → home-registry-data.</li>'
      +'<li>Permissions → Repository permissions → <b>Contents: Read and write</b>.</li>'
      +'<li>Срок действия — максимум. Скопируйте токен сюда.</li>'
      +'</ol></details>';
  }

  h+='<h4>Резервная копия</h4>'
    +'<div class="btnrow"><button class="btn ghost" data-a="export">Скачать копию данных</button>'
    +'<button class="btn ghost" data-a="import">Восстановить из файла</button></div>'
    +'<p class="hint">Файл содержит все объекты, задачи и инструкции (без фото). Храните копию на всякий случай.</p>'
    +'<div class="modal-foot"><button class="btn ghost" data-a="settings-close">Закрыть</button></div></div>';
  s.innerHTML=h;
}
function closeSettings(){var s=document.getElementById('settings');s.hidden=true;s.innerHTML='';settingsBackend=null;}
function beStatus(cls,msg){var el=document.getElementById('be-status');if(el){el.className='status-line '+cls;el.textContent=msg;}}

function ydOpenTokenPage(){
  var cid=document.getElementById('yd-client').value.trim();
  if(!cid){beStatus('bad','Сначала вставьте ClientID (инструкция ниже)');return;}
  var cfg=ydCfg()||{};cfg.clientId=cid;lsSet(YDKEY,cfg);
  window.open('https://oauth.yandex.ru/authorize?response_type=token&client_id='+encodeURIComponent(cid),'_blank');
  beStatus('','Подтвердите доступ на открывшейся странице, затем вставьте токен в поле ниже.');
}
function parseYdToken(s){
  s=String(s||'').trim();
  var m=s.match(/access_token=([^&\s#?]+)/);
  if(m)return m[1];
  if(/^[A-Za-z0-9._-]{20,}$/.test(s))return s;
  return null;
}
function ydConnect(){
  var cid=document.getElementById('yd-client').value.trim();
  var token=parseYdToken(document.getElementById('yd-token').value);
  if(!token){beStatus('bad','Не похоже на токен. Вставьте токен со страницы Яндекса или весь её адрес.');return;}
  beStatus('','Проверяю…');
  fetch(YD_API+'/resources?path='+encodeURIComponent('app:/')+'&fields=name',{headers:{'Authorization':'OAuth '+token},cache:'no-store'}).then(function(r){
    if(r.status===401){beStatus('bad','Яндекс не принял токен — получите его заново (Шаг 1).');return false;}
    if(r.status===403){beStatus('bad','У токена нет доступа к папке приложения. Проверьте, что в приложении на oauth.yandex.ru добавлен доступ «К папке приложения на Диске», и получите токен заново.');return false;}
    if(!r.ok&&r.status!==404){beStatus('bad','Яндекс ответил ошибкой '+r.status);return false;}
    return true; /* 404 — папка ещё не создана, появится при первом сохранении */
  }).then(function(ok){
    if(!ok)return;
    lsSet(YDKEY,{clientId:cid,token:token,exp:0});
    lsSet(BACKKEY,'yandex');
    beStatus('ok','Подключено. Данные будут синхронизироваться.');
    pull().then(function(){if(provider())push();});
  }).catch(function(){beStatus('bad','Нет связи с Яндексом. Проверьте интернет.');});
}
function ydCaptureToken(){
  if(location.hash.indexOf('access_token=')<0)return false;
  var p=new URLSearchParams(location.hash.slice(1));
  var t=p.get('access_token');
  if(!t)return false;
  var cfg=ydCfg()||{};
  cfg.token=t;
  var ex=parseInt(p.get('expires_in'),10);
  cfg.exp=ex?Date.now()+ex*1000:0;
  lsSet(YDKEY,cfg);
  lsSet(BACKKEY,'yandex');
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  return true;
}
function verifyAndSaveGh(){
  var owner=document.getElementById('gh-owner').value.trim();
  var repo=document.getElementById('gh-repo').value.trim();
  var token=document.getElementById('gh-token').value.trim();
  if(!owner||!repo||!token){beStatus('bad','Заполните все три поля');return;}
  beStatus('','Проверяю…');
  fetch('https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo),{
    headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},cache:'no-store'
  }).then(function(r){
    if(r.status===404){beStatus('bad','Репозиторий не найден. Проверьте логин, имя и доступ токена именно к этому репозиторию.');return null;}
    if(r.status===401){beStatus('bad','Токен не принят — скопируйте его заново.');return null;}
    if(!r.ok){beStatus('bad','GitHub ответил ошибкой '+r.status);return null;}
    return r.json();
  }).then(function(meta){
    if(!meta)return;
    if(!meta.permissions||!meta.permissions.push){beStatus('bad','У токена нет права записи (Contents: Read and write).');return;}
    if(!meta.private)beStatus('ok','Подключено. Внимание: репозиторий ПУБЛИЧНЫЙ — данные видны всем. Лучше сделать его приватным.');
    else beStatus('ok','Подключено. Данные будут синхронизироваться.');
    lsSet(GHKEY,{owner:owner,repo:repo,token:token});
    lsSet(BACKKEY,'github');
    pull().then(function(){if(provider())push();});
  }).catch(function(){beStatus('bad','Нет связи с GitHub. Проверьте интернет.');});
}

/* ══════════ экспорт / импорт ══════════ */
function doExport(){
  var blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='домашний-реестр-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},5000);
}
function doImport(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var data=JSON.parse(fr.result);
      if(!data||!Array.isArray(data.items))throw new Error('bad');
      data.rev=Math.max(data.rev||0,(state.rev||0))+1;
      state=data;writeLocal();touch();renderAll();closeSettings();
      toast('Данные восстановлены: '+plural(state.items.length,['объект','объекта','объектов']));
    }catch(e){toast('Файл не похож на копию реестра');}
  };
  fr.readAsText(file);
}

/* ══════════ уведомления ══════════ */
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.hidden=true;},3500);
}

/* ══════════ события ══════════ */
function onClick(e){
  var b=e.target.closest('[data-a]');
  if(!b)return;
  var a=b.dataset.a,id=b.dataset.id,it=id?find(id):null;
  if(a==='view'){route.view=b.dataset.v;renderNav();renderMain();}
  else if(a==='open'){e.stopPropagation();route.item=id;confirmDel=false;editingInstr={};renderDetail();}
  else if(a==='close'){closeDetail();}
  else if(a==='new'){openModal();}
  else if(a==='modal-close'){closeModal();}
  else if(a==='settings'){openSettings();}
  else if(a==='settings-close'){closeSettings();}
  else if(a==='pick-backend'){settingsBackend=b.dataset.v;openSettings();}
  else if(a==='gh-save'){verifyAndSaveGh();}
  else if(a==='gh-off'){lsSet(GHKEY,null);if(backendName()==='github')lsSet(BACKKEY,null);closeSettings();setChip(provider()?'saved':'local');toast('GitHub отключён, данные остались на устройстве');}
  else if(a==='yd-token-page'){ydOpenTokenPage();}
  else if(a==='yd-connect'){ydConnect();}
  else if(a==='yd-off'){lsSet(YDKEY,null);if(backendName()==='yandex')lsSet(BACKKEY,null);closeSettings();setChip(provider()?'saved':'local');toast('Яндекс Диск отключён, данные остались на устройстве');}
  else if(a==='export'){doExport();}
  else if(a==='import'){document.getElementById('import-input').click();}
  else if(a==='create'){
    var name=document.getElementById('ni-name').value.trim();
    if(!name){document.getElementById('ni-name').focus();return;}
    var item={id:uid(),name:name,cat:document.getElementById('ni-cat').value,status:'active',price:'',notes:'',specs:[],instructions:[],tasks:[],questions:[],plans:[],photos:[]};
    state.items.unshift(item);touch();closeModal();
    route.item=item.id;renderAll();
  }
  else if(a==='status'&&it){it.status=b.dataset.v;touch();renderAll();}
  else if(a==='tgl'&&it){
    (it[b.dataset.kind]||[]).forEach(function(x){if(x.id===b.dataset.sub)x.done=!x.done;});
    touch();renderNav();renderMain();if(route.item)renderDetail();
  }
  else if(a==='del-sub'&&it){
    it[b.dataset.kind]=(it[b.dataset.kind]||[]).filter(function(x){return x.id!==b.dataset.sub;});
    touch();renderAll();
  }
  else if(a==='add-sub'&&it){
    var map={tasks:'add-task',questions:'add-question',plans:'add-plan'};
    var inp=document.getElementById(map[b.dataset.kind]);
    var text=inp?inp.value.trim():'';
    if(!text){if(inp)inp.focus();return;}
    var entry={id:uid(),text:text,done:false};
    if(b.dataset.kind==='plans')entry.kind=newPlanKind;
    it[b.dataset.kind]=(it[b.dataset.kind]||[]);
    it[b.dataset.kind].push(entry);
    refocus=map[b.dataset.kind];
    touch();renderAll();
  }
  else if(a==='add-spec'&&it){
    var inp2=document.getElementById('add-spec');
    var raw=inp2.value.trim();
    if(!raw){inp2.focus();return;}
    var parts=raw.split(/\s+[—–-]\s+/);
    it.specs.push({id:uid(),k:parts[0],v:parts.slice(1).join(' — ')||''});
    refocus='add-spec';touch();renderDetail();
  }
  else if(a==='plan-kind'){newPlanKind=b.dataset.v;renderDetail();var i3=document.getElementById('add-plan');if(i3)i3.focus();}
  else if(a==='add-instr'&&it){
    var ins={id:uid(),title:'',text:''};
    it.instructions.push(ins);editingInstr[ins.id]=true;
    touch();renderDetail();
  }
  else if(a==='instr-edit'){editingInstr[b.dataset.sub]=true;renderDetail();}
  else if(a==='instr-done'){delete editingInstr[b.dataset.sub];renderDetail();}
  else if(a==='add-photo'&&it){
    var pi=document.getElementById('photo-input');
    pi.dataset.item=it.id;pi.value='';pi.click();
  }
  else if(a==='view-photo'){e.stopPropagation();openViewer(id,b.dataset.sub);}
  else if(a==='del-photo'&&it){delPhoto(it,b.dataset.sub);}
  else if(a==='close-viewer'){closeViewer();}
  else if(a==='del-ask'){confirmDel=true;renderDetail();}
  else if(a==='del-cancel'){confirmDel=false;renderDetail();}
  else if(a==='del-item'&&it){
    state.items=state.items.filter(function(x){return x.id!==id;});
    touch();closeDetail();renderNav();renderMain();
  }
}
function onChange(e){
  var t=e.target;
  if(t.id==='photo-input'){
    var it0=find(t.dataset.item);
    if(it0&&t.files&&t.files[0])addPhoto(it0,t.files[0]);
    return;
  }
  if(t.id==='import-input'){
    if(t.files&&t.files[0])doImport(t.files[0]);
    t.value='';return;
  }
  var f=t.dataset&&t.dataset.f;
  if(!f)return;
  var it=find(t.dataset.id);if(!it)return;
  if(f==='name'){it.name=t.value.trim()||'Без названия';renderNav();renderMain();}
  else if(f==='notes'){it.notes=t.value;renderMain();}
  else if(f==='price'){it.price=t.value;renderMain();}
  else if(f==='cat'){it.cat=t.value;renderAll();}
  else if(f==='spec-k'||f==='spec-v'){
    it.specs.forEach(function(s){if(s.id===t.dataset.sub){if(f==='spec-k')s.k=t.value;else s.v=t.value;}});
  }
  else if(f==='instr-title'||f==='instr-text'){
    it.instructions.forEach(function(s){if(s.id===t.dataset.sub){if(f==='instr-title')s.title=t.value;else s.text=t.value;}});
  }
  touch();
}

function renderAll(){renderNav();renderMain();renderDetail();}

/* ══════════ старт ══════════ */
function init(){
  var justLoggedIn=ydCaptureToken();
  state=readLocal()||SEED;
  if(!state.items)state.items=[];
  document.getElementById('q').addEventListener('input',function(e){query=e.target.value.trim();renderMain();});
  document.addEventListener('click',onClick);
  document.addEventListener('change',onChange);
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){closeViewer();closeDetail();closeModal();closeSettings();}
    if(e.key==='Enter'&&e.target.matches&&e.target.matches('.addrow input[type=text]')){
      var btn=e.target.parentElement.querySelector('[data-a]');
      if(btn)btn.click();
    }
  });
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&provider()&&Date.now()-lastPull>30000)pull(true);
  });
  renderAll();
  if(justLoggedIn){
    toast('Яндекс Диск подключён');
    setChip('pending');
    pull(true).then(function(){if(provider())push();});
  }else if(provider()){
    setChip('pending');pull(true);
  }else setChip('local');
}
init();
})();
</script>
