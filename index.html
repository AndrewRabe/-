  items.forEach(function(it,idx){
    var ad=adOf(it),cond=/^нов/i.test(ad.cond||'')?'Новое':'Б/у';
    s+='  <Ad>\n    <Id>'+xmlEsc(it.id)+'</Id>\n    <AdStatus>Free</AdStatus>\n';

    s+='    <Price>'+(moneyNum(it.price)||0)+'</Price>\n';
    s+='    <Condition>'+cond+'</Condition>\n';
    s+='    <Address>'+xmlEsc(st.address||'')+'</Address>\n';

function makeZip(){
  var items=exportItems();
  if(!items.length){toast('В выбранную группу не попало ни одной вещи');return;}
  toast('Собираю архив…');
  var entries=[],jobs=[],fullPhotos=true,anyPhoto=false;
  items.forEach(function(it,idx){
    var folder=itemFolder(it,idx);
    if(exportOpts.photos){
      (it.photos||[]).forEach(function(ph,i){
        anyPhoto=true;
        jobs.push(photoBytes(ph).then(function(r){
          if(!r.full)fullPhotos=false;
          entries.push({name:folder+'/'+photoName(i),data:r.bytes,ord:idx*100+i});
        }).catch(function(){fullPhotos=false;}));
      });
    }
    if(exportOpts.text){
      entries.push({name:folder+'/avito.txt',data:utf8('﻿'+itemTxt(it,'avito')),ord:idx*100+50});
      entries.push({name:folder+'/youla.txt',data:utf8('﻿'+itemTxt(it,'youla')),ord:idx*100+51});
    }
  });
  Promise.all(jobs).then(function(){
    entries.sort(function(a,b){return (a.ord||0)-(b.ord||0);});
    if(exportOpts.html)entries.push({name:'Объявления.html',data:utf8(buildHtmlPage(items))});
    if(exportOpts.csv)entries.push({name:'Список вещей.csv',data:utf8(buildCsv(items))});
    if(exportOpts.xml)entries.push({name:'avito-feed.xml',data:utf8(buildAvitoXml(items))});
    if(exportOpts.yml)entries.push({name:'youla-feed.yml',data:utf8(buildYoulaYml(items))});
    entries.push({name:'Как выкладывать.txt',data:utf8('﻿'+buildReadme(items,fullPhotos||!anyPhoto))});
    try{
      var blob=zipBuild(entries);
      downloadBlob(blob,'obyavleniya-'+todayStr()+'.zip');
      toast('Готово: '+plural(items.length,['вещь','вещи','вещей'])+', '+(blob.size/1048576).toFixed(1)+' МБ');
      closeExport();
    }catch(e){toast('Не удалось собрать архив: '+e.message);}
  });
}

function onClick(e){
  var b=e.target.closest('[data-a]');
  if(!b)return;
  var a=b.dataset.a,id=b.dataset.id,it=id?find(id):null;
  if(a==='view'){route.view=b.dataset.v;renderNav();renderMain();}
  else if(a==='open'){e.stopPropagation();route.item=id;confirmDel=false;editingInstr={};renderDetail();}
  else if(a==='close'){closeDetail();}
  else if(a==='new'){openModal();}
  else if(a==='modal-close'){closeModal();}
  else if(a==='settings'){openSettings();}
  else if(a==='settings-close'){closeSettings();}
  else if(a==='pick-backend'){settingsBackend=b.dataset.v;openSettings();}
  else if(a==='gh-save'){verifyAndSaveGh();}
  else if(a==='gh-off'){lsSet(GHKEY,null);if(backendName()==='github')lsSet(BACKKEY,null);closeSettings();setChip(provider()?'saved':'local');toast('GitHub отключён, данные остались на устройстве');}
  else if(a==='yd-token-page'){ydOpenTokenPage();}
  else if(a==='yd-connect'){ydConnect();}
  else if(a==='yd-off'){lsSet(YDKEY,null);if(backendName()==='yandex')lsSet(BACKKEY,null);closeSettings();setChip(provider()?'saved':'local');toast('Яндекс Диск отключён, данные остались на устройстве');}
  else if(a==='export'){doExport();}
  else if(a==='import'){document.getElementById('import-input').click();}
  else if(a==='create'){
    var name=document.getElementById('ni-name').value.trim();
    if(!name){document.getElementById('ni-name').focus();return;}
    var item={id:uid(),name:name,cat:document.getElementById('ni-cat').value,status:'active',price:'',notes:'',specs:[],instructions:[],tasks:[],questions:[],plans:[],photos:[]};
    state.items.unshift(item);touch();closeModal();
    route.item=item.id;renderAll();
  }
  else if(a==='status'&&it){it.status=b.dataset.v;touch();renderAll();}
  else if(a==='tgl'&&it){
    (it[b.dataset.kind]||[]).forEach(function(x){if(x.id===b.dataset.sub)x.done=!x.done;});
    touch();renderNav();renderMain();if(route.item)renderDetail();
  }
  else if(a==='del-sub'&&it){
    it[b.dataset.kind]=(it[b.dataset.kind]||[]).filter(function(x){return x.id!==b.dataset.sub;});
    touch();renderAll();
  }
  else if(a==='add-sub'&&it){
    var map={tasks:'add-task',questions:'add-question',plans:'add-plan'};
    var inp=document.getElementById(map[b.dataset.kind]);
    var text=inp?inp.value.trim():'';
    if(!text){if(inp)inp.focus();return;}
    var entry={id:uid(),text:text,done:false};
    if(b.dataset.kind==='plans')entry.kind=newPlanKind;
    if(b.dataset.kind==='tasks'){var dd=document.getElementById('add-task-due');if(dd&&dd.value)entry.due=dd.value;}
    it[b.dataset.kind]=(it[b.dataset.kind]||[]);
    it[b.dataset.kind].push(entry);
    refocus=map[b.dataset.kind];
    touch();renderAll();
  }
  else if(a==='add-spec'&&it){
    var inp2=document.getElementById('add-spec');
    var raw=inp2.value.trim();
    if(!raw){inp2.focus();return;}
    var parts=raw.split(/\s+[—–-]\s+/);
    it.specs.push({id:uid(),k:parts[0],v:parts.slice(1).join(' — ')||''});
    refocus='add-spec';touch();renderDetail();
  }
  else if(a==='plan-kind'){newPlanKind=b.dataset.v;renderDetail();var i3=document.getElementById('add-plan');if(i3)i3.focus();}
  else if(a==='svc-add'&&it){
    var sel=document.getElementById('svc-preset'),v=sel?sel.value:'0';
    var nm,km,mo;
    if(v==='custom'){
      nm=(prompt('Название позиции, например «Замена ремня генератора»')||'').trim();
      if(!nm)return;
      km=moneyNum(prompt('Интервал в километрах (можно оставить пустым)','')||'');
      mo=moneyNum(prompt('Интервал в месяцах (можно оставить пустым)','')||'');
      if(!km&&!mo){toast('Нужен интервал: километры или месяцы');return;}
    }else{
      var pr=SVC_PRESETS[parseInt(v,10)]||SVC_PRESETS[0];
      nm=pr.name;km=pr.km;mo=pr.months;
    }
    var cc=carOf(it);
    cc.plan.push({id:uid(),name:nm,km:km,months:mo,lastKm:'',lastAt:''});
    touch();renderDetail();
  }
  else if(a==='svc-done'&&it){
    var c1=carOf(it);
    c1.plan.forEach(function(sv){
      if(sv.id!==b.dataset.sub)return;
      sv.lastAt=todayStr();
      if(moneyNum(c1.odo))sv.lastKm=String(moneyNum(c1.odo));
      c1.log.push({id:uid(),date:todayStr(),odo:c1.odo||'',text:sv.name,cost:'',place:''});
      toast('Отмечено и записано в журнал: '+sv.name);
    });
    touch();renderDetail();
  }
  else if(a==='svc-task'&&it){
    var c2=carOf(it);
    c2.plan.forEach(function(sv){
      if(sv.id!==b.dataset.sub)return;
      var st=svcState(c2,sv);
      it.tasks=it.tasks||[];
      it.tasks.push({id:uid(),text:sv.name,done:false,due:st.due||todayStr()});
      toast('Добавлено в задачи: '+sv.name);
    });
    touch();renderDetail();renderNav();
  }
  else if(a==='svc-del'&&it){
    var c3=carOf(it);
    c3.plan=c3.plan.filter(function(sv){return sv.id!==b.dataset.sub;});
    touch();renderDetail();
  }
  else if(a==='log-add'&&it){
    var lt=document.getElementById('log-text');
    var text=lt?lt.value.trim():'';
    if(!text){if(lt)lt.focus();return;}
    var c4=carOf(it);
    var ld=document.getElementById('log-date'),lo=document.getElementById('log-odo'),lc=document.getElementById('log-cost'),lp=document.getElementById('log-place');
    c4.log.push({id:uid(),date:(ld&&ld.value)||todayStr(),odo:(lo&&lo.value)||'',text:text,cost:(lc&&lc.value)||'',place:(lp&&lp.value)||''});
    if(lo&&moneyNum(lo.value)&&moneyNum(lo.value)>moneyNum(c4.odo)){c4.odo=String(moneyNum(lo.value));c4.odoAt=todayStr();}
    refocus='log-text';touch();renderDetail();
  }
  else if(a==='log-del'&&it){
    var c5=carOf(it);
    c5.log=c5.log.filter(function(r){return r.id!==b.dataset.sub;});
    touch();renderDetail();
  }
  else if(a==='sum-add-task'){
    var sti=document.getElementById('sum-task'),std=document.getElementById('sum-task-due'),sto=document.getElementById('sum-task-item');
    var stext=sti?sti.value.trim():'';
    if(!stext){if(sti)sti.focus();return;}
    var sit=find(sto&&sto.value);
    if(!sit)return;
    var entry={id:uid(),text:stext,done:false};
    if(std&&std.value)entry.due=std.value;
    sit.tasks=sit.tasks||[];sit.tasks.push(entry);
    refocus='sum-task';touch();renderAll();
  }
  else if(a==='sum-add-plan'){
    var spi=document.getElementById('sum-plan'),spo=document.getElementById('sum-plan-item');
    var ptext=spi?spi.value.trim():'';
    if(!ptext){if(spi)spi.focus();return;}
    var pit=find(spo&&spo.value);
    if(!pit)return;
    pit.plans=pit.plans||[];
    pit.plans.push({id:uid(),text:ptext,done:false,kind:newPlanKind});
    refocus='sum-plan';touch();renderAll();
  }
  else if(a==='sum-plan-kind'){
    newPlanKind=b.dataset.v;
    var keep=document.getElementById('sum-plan'),kv=keep?keep.value:'';
    renderMain();
    var again=document.getElementById('sum-plan');
    if(again){again.value=kv;again.focus();}
  }
  else if(a==='cal-nav'){
    if(b.dataset.v==='0'){var n0=new Date();calY=n0.getFullYear();calM=n0.getMonth();calSel=todayStr();}
    else{calM+=parseInt(b.dataset.v,10);if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}}
    renderMain();
  }
  else if(a==='cal-day'){calSel=b.dataset.v;renderMain();}
  else if(a==='add-event'){
    var ti=document.getElementById('ev-title'),tm=document.getElementById('ev-time'),si=document.getElementById('ev-item');
    var evt=ti.value.trim();
    if(!evt){ti.focus();return;}
    var rp=document.getElementById('ev-repeat');
    var ne={id:uid(),title:evt,date:calSel,time:(tm&&tm.value)||'',itemId:(si&&si.value)||'',repeat:(rp&&rp.value)||''};
    if(ne.repeat==='weekly'&&newDays.length)ne.days=newDays.slice();
    state.events.push(ne);
    refocus='ev-title';touch();renderNav();renderMain();
  }
  else if(a==='add-event-d'&&it){
    var td=document.getElementById('ev-title-d'),dd2=document.getElementById('ev-date-d');
    var ttl=td.value.trim();
    if(!ttl){td.focus();return;}
    if(!dd2.value){dd2.focus();return;}
    state.events.push({id:uid(),title:ttl,date:dd2.value,time:'',itemId:it.id});
    refocus='ev-title-d';touch();renderDetail();renderNav();
  }
  else if(a==='ev-dow'){
    var di=parseInt(b.dataset.v,10),pos=newDays.indexOf(di);
    if(pos<0)newDays.push(di);else newDays.splice(pos,1);
    var keepT=document.getElementById('ev-title'),kt=keepT?keepT.value:'';
    renderMain();
    var backT=document.getElementById('ev-title');
    if(backT)backT.value=kt;
  }
  else if(a==='add-bd'){
    var bn=document.getElementById('bd-name'),bdt=document.getElementById('bd-date');
    var bname=bn?bn.value.trim():'';
    if(!bname){if(bn)bn.focus();return;}
    if(!bdt||!bdt.value){if(bdt)bdt.focus();toast('Укажите дату рождения');return;}
    state.birthdays.push({id:uid(),name:bname,date:bdt.value});
    refocus='bd-name';touch();renderNav();renderMain();
  }
  else if(a==='del-bd'){
    state.birthdays=(state.birthdays||[]).filter(function(x){return x.id!==id;});
    touch();renderNav();renderMain();
  }
  else if(a==='del-event'){
    state.events=(state.events||[]).filter(function(x){return x.id!==b.dataset.sub;});
    touch();renderNav();renderMain();if(route.item)renderDetail();
  }
  else if(a==='import-ev'){document.getElementById('import-ev-input').click();}
  else if(a==='notif-on'){askNotif();}
  else if(a==='notif-off'){notifSet(false);openSettings();toast('Напоминания выключены');}
  else if(a==='notif-test'){
    try{localStorage.removeItem(NOTIF_KEY);}catch(e){}
    var dd=dueSummary();
    if(!dd.total){toast('Сегодня напоминать не о чем');return;}
    checkReminders();
  }
  else if(a==='import-tasks'){
    if(!state.items.filter(visible).length){toast('Сначала добавьте хотя бы один объект — задачам нужен владелец');return;}
    document.getElementById('import-tasks-input').click();
  }
  else if(a==='add-wish'){
    var wn=document.getElementById('wish-new'),wt=document.getElementById('wish-new-target');
    var wtitle=wn.value.trim();
    if(!wtitle){wn.focus();return;}
    state.wishes.unshift({id:uid(),title:wtitle,target:wt.value.trim(),last:'',lastAt:'',min:'',links:[],status:'active'});
    refocus='wish-new';touch();renderNav();renderMain();
  }
  else if(a==='del-wish'){
    state.wishes=(state.wishes||[]).filter(function(w){return w.id!==id;});
    touch();renderNav();renderMain();
  }
  else if(a==='wish-bought'){
    (state.wishes||[]).forEach(function(w){if(w.id===id)w.status=(w.status==='bought'?'active':'bought');});
    touch();renderNav();renderMain();
  }
  else if(a==='add-wish-link'){
    var wu=document.getElementById('wl-url-'+id),wm=document.getElementById('wl-market-'+id);
    var url=wu?wu.value.trim():'';
    if(!url){if(wu)wu.focus();return;}
    if(!/^https?:\/\//i.test(url))url='https://'+url;
    (state.wishes||[]).forEach(function(w){
      if(w.id===id){w.links=w.links||[];w.links.push({id:uid(),market:wm?wm.value:'other',url:url});}
    });
    touch();renderMain();
  }
  else if(a==='del-wish-link'){
    (state.wishes||[]).forEach(function(w){
      if(w.id===id)w.links=(w.links||[]).filter(function(l){return l.id!==b.dataset.sub;});
    });
    touch();renderMain();
  }
  else if(a==='wish-refresh'){
    toast('Читаю цены монитора…');
    ydPricesLoad(true).then(function(m){
      renderMain();
      toast(Object.keys(m).length?'Цены обновлены':'Монитор пока не записал ни одной цены');
    });
  }
  else if(a==='wish-export-monitor'){
    var cmds=['@echo off','chcp 65001 >nul','rem Список желаний из «Домашнего реестра» для ozon-price-monitor','rem Запустите этот файл в папке монитора (или скопируйте команды).',''];
    (state.wishes||[]).forEach(function(w){
      if(w.status==='bought')return;
      (w.links||[]).forEach(function(l){
        if(l.market!=='ozon')return;
        var c='python monitor.py add "'+l.url+'" --name "'+String(w.title).replace(/"/g,'')+'"';
        var tn=moneyNum(w.target);
        if(tn)c+=' --target '+tn;
        cmds.push(c);
      });
    });
    var blob=new Blob([cmds.join('\r\n')+'\r\n'],{type:'text/plain'});
    var a2=document.createElement('a');
    a2.href=URL.createObjectURL(blob);
    a2.download='ozon-monitor-add.bat';
    document.body.appendChild(a2);a2.click();a2.remove();
    setTimeout(function(){URL.revokeObjectURL(a2.href);},5000);
    toast('Файл со списком для монитора скачан');
  }
  else if(a==='ad-mode'){adMode=b.dataset.v;renderDetail();}
  else if(a==='x-open'){openExport();}
  else if(a==='x-close'){closeExport();}
  else if(a==='x-scope'){exportOpts.scope=b.dataset.v;openExport();}
  else if(a==='x-make'){makeZip();}
  else if(a==='ad-copy-title'&&it){copyText(adTitle(it),'Заголовок');}
  else if(a==='ad-copy-text'&&it){copyText(adText(it),'Текст объявления');}
  else if(a==='add-instr'&&it){
    var ins={id:uid(),title:'',text:''};
    it.instructions.push(ins);editingInstr[ins.id]=true;
    touch();renderDetail();
  }
  else if(a==='instr-edit'){editingInstr[b.dataset.sub]=true;renderDetail();}
  else if(a==='instr-edit-done'){delete editingInstr[b.dataset.sub];renderDetail();}
  else if(a==='instr-done'&&it){
    (it.instructions||[]).forEach(function(ins){
      if(ins.id!==b.dataset.sub||!ins.due)return;
      if(ins.repeat){
        var next=ins.repeat==='daily'?addMonths(ins.due,0):'';
        if(ins.repeat==='daily'){var d1=new Date(ins.due);d1.setDate(d1.getDate()+1);next=d1.getFullYear()+'-'+pad2(d1.getMonth()+1)+'-'+pad2(d1.getDate());}
        else if(ins.repeat==='weekly'){var d7=new Date(ins.due);d7.setDate(d7.getDate()+7);next=d7.getFullYear()+'-'+pad2(d7.getMonth()+1)+'-'+pad2(d7.getDate());}
        else if(ins.repeat==='monthly')next=addMonths(ins.due,1);
        else if(ins.repeat==='yearly')next=addMonths(ins.due,12);
        var today0=todayStr();
        while(next&&next<today0){
          if(ins.repeat==='daily'){var dn=new Date(next);dn.setDate(dn.getDate()+1);next=dn.getFullYear()+'-'+pad2(dn.getMonth()+1)+'-'+pad2(dn.getDate());}
          else if(ins.repeat==='weekly'){var wn=new Date(next);wn.setDate(wn.getDate()+7);next=wn.getFullYear()+'-'+pad2(wn.getMonth()+1)+'-'+pad2(wn.getDate());}
          else if(ins.repeat==='monthly')next=addMonths(next,1);
          else next=addMonths(next,12);
        }
        ins.due=next;
        toast('Отмечено, следующее напоминание — '+fmtDue(next));
      }else{
        ins.due='';
        toast('Напоминание снято');
      }
    });
    touch();renderDetail();renderNav();renderMain();
  }
  else if(a==='instr-task'&&it){
    (it.instructions||[]).forEach(function(ins){
      if(ins.id!==b.dataset.sub)return;
      it.tasks=it.tasks||[];
      it.tasks.push({id:uid(),text:ins.title||'Инструкция',done:false,due:ins.due||todayStr()});
      toast('Добавлено в задачи: '+(ins.title||'инструкция'));
    });
    touch();renderDetail();renderNav();
  }
  else if(a==='add-photo'&&it){
    var pi=document.getElementById('photo-input');
    pi.dataset.item=it.id;pi.value='';pi.click();
  }
  else if(a==='view-photo'){e.stopPropagation();openViewer(id,b.dataset.sub);}
  else if(a==='photo-disk'){if(b.dataset.dpath)ydOpenInDisk(b.dataset.dpath);}
  else if(a==='del-photo'&&it){
    e.stopPropagation();
    if(b.classList.contains('photo-del')&&confirmPhoto!==b.dataset.sub){
      confirmPhoto=b.dataset.sub;
      b.textContent='✓';b.style.opacity='1';b.title='Нажмите ещё раз, чтобы удалить';
      toast('Нажмите ещё раз, чтобы удалить фото');
      clearTimeout(confirmPhotoTimer);
      confirmPhotoTimer=setTimeout(function(){confirmPhoto=null;renderDetail();},4000);
      return;
    }
    confirmPhoto=null;clearTimeout(confirmPhotoTimer);
    delPhoto(it,b.dataset.sub);
  }
  else if(a==='close-viewer'){closeViewer();}
  else if(a==='del-ask'){confirmDel=true;renderDetail();}
  else if(a==='del-cancel'){confirmDel=false;renderDetail();}
  else if(a==='del-item'&&it){
    state.items=state.items.filter(function(x){return x.id!==id;});
    touch();closeDetail();renderNav();renderMain();
  }
}
function onChange(e){
  var t=e.target;
  if(t.id==='photo-input'){
    var it0=find(t.dataset.item);
    if(it0&&t.files&&t.files[0])addPhoto(it0,t.files[0]);
    return;
  }
  if(t.id==='import-input'){
    if(t.files&&t.files[0])doImport(t.files[0]);
    t.value='';return;
  }
  if(t.id==='import-ev-input'){
    if(t.files&&t.files[0])doImportEvents(t.files[0]);
    t.value='';return;
  }
  if(t.id==='ev-repeat'){
    newRepeat=t.value;
    var keepTitle=document.getElementById('ev-title'),kv2=keepTitle?keepTitle.value:'';
    renderMain();
    var back=document.getElementById('ev-title');
    if(back)back.value=kv2;
    return;
  }
  if(t.id==='import-tasks-input'){
    if(t.files&&t.files[0])doImportTasks(t.files[0]);
    t.value='';return;
  }
  var f=t.dataset&&t.dataset.f;
  if(!f)return;
  if(f==='xopt'){exportOpts[t.dataset.k]=t.checked;openExport();return;}
  if(f.indexOf('set-')===0){settings()[f.slice(4)]=t.value;touch();return;}
  if(f==='bd-name'||f==='bd-date'){
    (state.birthdays||[]).forEach(function(bd){
      if(bd.id!==t.dataset.id)return;
      if(f==='bd-name')bd.name=t.value.trim()||'Без имени';
      else{bd.date=t.value;bd.noAge=false;}
    });
    touch();renderNav();renderMain();
    return;
  }
  if(f.indexOf('wish-')===0){
    var w0=(state.wishes||[]).filter(function(w){return w.id===t.dataset.id;})[0];
    if(!w0)return;
    if(f==='wish-title')w0.title=t.value.trim()||'Без названия';
    else if(f==='wish-target')w0.target=t.value.trim();
    else if(f==='wish-last'){
      w0.last=t.value.trim();
      w0.lastAt=todayStr();
      var ln=moneyNum(w0.last),mn=moneyNum(w0.min);
      if(ln&&(!mn||ln<mn))w0.min=w0.last;
    }
    touch();renderNav();renderMain();
    return;
  }
  var it=find(t.dataset.id);if(!it)return;
  if(f==='name'){it.name=t.value.trim()||'Без названия';renderNav();renderMain();}
  else if(f==='notes'){it.notes=t.value;renderMain();}
  else if(f==='price'){it.price=t.value;renderMain();}
  else if(f==='cat'){it.cat=t.value;renderAll();}
  else if(f==='spec-k'||f==='spec-v'){
    it.specs.forEach(function(s){if(s.id===t.dataset.sub){if(f==='spec-k')s.k=t.value;else s.v=t.value;}});
  }
  else if(f==='instr-due'||f==='instr-repeat'){
    (it.instructions||[]).forEach(function(ins){
      if(ins.id!==t.dataset.sub)return;
      if(f==='instr-due')ins.due=t.value;else ins.repeat=t.value;
      if(ins.repeat&&!ins.due)ins.due=todayStr();
    });
    renderDetail();renderNav();renderMain();
  }
  else if(f==='instr-title'||f==='instr-text'){
    it.instructions.forEach(function(s){if(s.id===t.dataset.sub){if(f==='instr-title')s.title=t.value;else s.text=t.value;}});
  }
  else if(f==='task-due'){
    (it.tasks||[]).forEach(function(x){if(x.id===t.dataset.sub)x.due=t.value||'';});
    renderNav();renderMain();
  }
  else if(f==='pl-posted'){
    var pp=adPlatforms(it)[t.dataset.k];
    pp.posted=t.checked;
    if(t.checked&&!pp.date)pp.date=todayStr();
    if(!t.checked){pp.date='';pp.url='';}
    renderDetail();
  }
  else if(f==='pl-url'){adPlatforms(it)[t.dataset.k].url=t.value;}
  else if(f==='car-odo'){
    var cc2=carOf(it);
    cc2.odo=t.value;cc2.odoAt=todayStr();
    renderDetail();
  }
  else if(f.indexOf('ad-')===0){
    var ad0=adOf(it),key=f.slice(3);
    if(t.type==='checkbox')ad0[key]=t.checked;else ad0[key]=t.value;
    renderDetail();
  }
  touch();
}

function renderAll(){renderNav();renderMain();renderDetail();}

/* ══════════ старт ══════════ */
function init(){
  var justLoggedIn=ydCaptureToken();
  state=readLocal()||SEED;
  if(!state.items)state.items=[];
  if(!state.events)state.events=[];
  if(!state.wishes)state.wishes=[];
  if(!state.birthdays)state.birthdays=[];
  if(!state.settings)state.settings={phone:'',manager:'',address:'',photoBase:''};
  document.getElementById('q').addEventListener('input',function(e){query=e.target.value.trim();renderMain();});
  document.addEventListener('click',onClick);
  document.addEventListener('change',onChange);
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){closeViewer();closeDetail();closeModal();closeSettings();}
    if(e.key==='Enter'&&e.target.matches&&e.target.matches('.addrow input[type=text]')){
      var btn=e.target.parentElement.querySelector('[data-a]');
      if(btn)btn.click();
    }
  });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden)return;
    if(provider()&&Date.now()-lastPull>30000)pull(true);
    checkReminders();
  });
  renderAll();
  setTimeout(checkReminders,1500);
  if(justLoggedIn){
    toast('Яндекс Диск подключён');
    setChip('pending');
    pull(true).then(function(){if(provider())push();});
  }else if(provider()){
    /* при каждом открытии: сначала забрать более новое, затем долить своё, если в хранилище пусто или старее */
    setChip('pending');
    pull(true).then(function(){if(provider())push();});
  }else setChip('local');
}
init();
})();
</script>
