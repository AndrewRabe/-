name: Проверка цен Ozon

on:
  schedule:
    - cron: '17 */6 * * *'   # каждые 6 часов
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости
        run: pip install requests
      - name: Проверить цены и записать в реестр
        working-directory: monitor
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          OZON_TG_TOKEN: ${{ secrets.OZON_TG_TOKEN }}
          OZON_TG_CHAT_ID: ${{ secrets.OZON_TG_CHAT_ID }}
        run: python registry_sync.py
