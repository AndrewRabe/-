name: Напоминания

on:
  schedule:
    - cron: '0 5 * * *'    # 08:00 по Москве (UTC+3)
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости
        run: pip install requests cryptography
      - name: Пуш-уведомления на телефон
        working-directory: monitor
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          TZ_OFFSET: '3'
        run: python push_send.py
        continue-on-error: true

      - name: Напоминание в Telegram
        working-directory: monitor
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          OZON_TG_TOKEN: ${{ secrets.OZON_TG_TOKEN }}
          OZON_TG_CHAT_ID: ${{ secrets.OZON_TG_CHAT_ID }}
          TZ_OFFSET: '3'
        run: python reminders.py
        continue-on-error: true
